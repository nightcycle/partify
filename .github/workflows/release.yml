name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          echo "sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release.py validate "$RELEASE_TAG"
  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  binaries:
    needs: [prepare, checks]
    strategy:
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc, platform: windows-x86_64}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, platform: macos-x86_64}
          - {os: macos-15, target: aarch64-apple-darwin, platform: macos-aarch64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/release.py package "$RELEASE_TAG" ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: partify-${{ matrix.platform }}
          path: dist/*.zip
  publish:
    needs: [prepare, checks, binaries]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: python scripts/release.py checksums dist
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$SOURCE_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes dist/*
          fi
          gh release edit "$RELEASE_TAG" --draft=false
